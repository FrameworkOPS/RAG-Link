<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPS Dashboard — Summit Roofing & Gutters</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#020817;color:#f1f5f9;font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#0f172a}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:240px;background:#0f172a;border-right:1px solid rgba(51,65,85,.5);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{height:72px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid rgba(51,65,85,.5);gap:10px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#2563eb,#0891b2);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.75}
.logo-text{display:flex;flex-direction:column}
.logo-name{font-size:13px;font-weight:700;color:#f1f5f9;line-height:1.2}
.logo-sub{font-size:10px;color:#64748b;letter-spacing:.3px}
nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:500;color:#94a3b8;cursor:pointer;transition:all .15s;border:1px solid transparent;user-select:none}
.nav-item:hover{background:#1e293b;color:#f1f5f9}
.nav-item.active{background:rgba(59,130,246,.15);color:#60a5fa;border-color:rgba(59,130,246,.2)}
.nav-item svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;flex-shrink:0}
.sidebar-user{padding:14px 16px;border-top:1px solid rgba(51,65,85,.5)}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar{width:34px;height:34px;background:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:13px;font-weight:600;color:#f1f5f9}
.user-role{font-size:11px;color:#64748b}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:56px;background:#0f172a;border-bottom:1px solid rgba(51,65,85,.5);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.header-title{font-size:15px;font-weight:700;color:#f1f5f9}
.header-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:#1e293b;color:#f1f5f9;border:1px solid rgba(51,65,85,.6)}.btn-secondary:hover{background:#334155}
.content{flex:1;overflow-y:auto;padding:20px 24px}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px 18px}
.stat-label{font-size:11px;font-weight:500;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:800;line-height:1;margin-bottom:4px}
.stat-sub{font-size:11px;color:#475569}
.stat-icon{float:right;opacity:.6}
.stat-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75}
.c-blue{color:#60a5fa}.c-green{color:#34d399}.c-yellow{color:#fbbf24}.c-red{color:#f87171}.c-purple{color:#c084fc}.c-cyan{color:#22d3ee}

/* Cards */
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;margin-bottom:18px}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(51,65,85,.6)}
.card-title{font-size:13px;font-weight:700;color:#f1f5f9}
.card-link{font-size:11px;color:#60a5fa;cursor:pointer;text-decoration:none}.card-link:hover{color:#93c5fd}
.card-body{padding:0}

/* QBO tile */
.qbo-tile{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px 18px;margin-bottom:18px}
.qbo-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.qbo-icon{width:28px;height:28px;background:rgba(34,197,94,.15);border-radius:8px;display:flex;align-items:center;justify-content:center}
.qbo-icon svg{width:15px;height:15px;fill:none;stroke:#4ade80;stroke-width:2}
.qbo-title{font-size:13px;font-weight:700;color:#f1f5f9}
.qbo-sub{font-size:10px;color:#64748b}
.qbo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.qbo-item label{font-size:10px;color:#64748b;display:block;margin-bottom:2px}
.qbo-item span{font-size:17px;font-weight:800}

/* Two-col */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* Table rows */
.row-item{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid rgba(51,65,85,.3)}
.row-item:last-child{border-bottom:none}
.row-text{flex:1;font-size:12px;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:11px;color:#64748b;flex-shrink:0}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;flex-shrink:0}
.badge-green{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
.badge-red{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.25)}
.badge-yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
.badge-blue{background:rgba(96,165,250,.15);color:#60a5fa;border:1px solid rgba(96,165,250,.25)}
.badge-slate{background:rgba(100,116,139,.2);color:#94a3b8;border:1px solid rgba(100,116,139,.3)}

/* Scorecard */
.sc-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.team-filter{display:flex;gap:6px}
.tf-btn{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #334155;background:#1e293b;color:#94a3b8;transition:all .15s}
.tf-btn.active{background:rgba(59,130,246,.15);color:#60a5fa;border-color:rgba(59,130,246,.3)}
.legend{display:flex;gap:14px;font-size:11px;color:#64748b}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.sc-table-wrap{background:#1e293b;border:1px solid #334155;border-radius:12px;overflow-x:auto}
.sc-table{width:100%;border-collapse:collapse;font-size:11px}
.sc-table th{padding:9px 10px;text-align:center;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:#64748b;border-bottom:1px solid #334155;white-space:nowrap}
.sc-table th:first-child{text-align:left;min-width:160px;position:sticky;left:0;background:#1e293b;z-index:2}
.sc-table th:nth-child(2){min-width:70px}
.sc-table th.cur{color:#60a5fa;background:rgba(59,130,246,.06);border-left:1px solid rgba(59,130,246,.25);border-right:1px solid rgba(59,130,246,.25)}
.sc-table td{padding:9px 10px;text-align:center;border-bottom:1px solid rgba(51,65,85,.3);white-space:nowrap;cursor:pointer}
.sc-table tr:last-child td{border-bottom:none}
.sc-table tr:hover td{background:rgba(30,41,59,.6)}
.sc-table td:first-child{text-align:left;position:sticky;left:0;background:#1e293b;z-index:1}
.sc-table tr:hover td:first-child{background:#1a2740}
.sc-table td.cur{background:rgba(59,130,246,.05);border-left:1px solid rgba(59,130,246,.15);border-right:1px solid rgba(59,130,246,.15)}
.sc-table td.on{color:#4ade80;font-weight:700}
.sc-table td.off{color:#f87171;font-weight:700}
.sc-table td.no{color:#475569}
.metric-name{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#f1f5f9}
.metric-team{font-size:10px;color:#475569;font-weight:400}

/* Rocks kanban */
.rocks-filters{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.rocks-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.col-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#64748b}
.col-count{font-size:10px;font-weight:700;background:#334155;color:#94a3b8;border-radius:20px;padding:1px 8px}
.rock-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:14px;margin-bottom:10px;border-left-width:3px}
.rock-card.bc-slate{border-left-color:#475569}
.rock-card.bc-green{border-left-color:rgba(34,197,94,.5)}
.rock-card.bc-yellow{border-left-color:rgba(251,191,36,.5)}
.rock-card.bc-blue{border-left-color:rgba(96,165,250,.5)}
.rock-title{font-size:12px;font-weight:600;color:#f1f5f9;margin-bottom:8px;line-height:1.4}
.rock-meta{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#64748b;margin-bottom:8px}
.rock-progress{margin-top:8px}
.rock-prog-label{display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-bottom:4px}
.prog-bar{height:4px;background:#334155;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .3s}
.prog-fill.green{background:#22c55e}
.prog-fill.yellow{background:#eab308}
.prog-fill.blue{background:#3b82f6}
.prog-fill.slate{background:#475569}
.empty-col{text-align:center;padding:28px 10px;font-size:11px;color:#475569;background:rgba(30,41,59,.4);border:1px dashed #334155;border-radius:10px}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#1e293b;border:1px solid #334155;border-radius:16px;width:100%;max-width:680px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.6)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #334155;flex-shrink:0}
.modal-title{font-size:14px;font-weight:700;color:#f1f5f9}
.modal-sub{font-size:11px;color:#64748b;margin-top:2px}
.modal-close{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;color:#64748b;background:transparent;border:none;transition:all .15s}
.modal-close:hover{background:#334155;color:#f1f5f9}
.modal-body{padding:20px;overflow-y:auto}
.chart-wrap{background:rgba(15,23,42,.5);border-radius:10px;padding:16px;margin-bottom:16px}
.history-table{width:100%;border-collapse:collapse}
.history-table th{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;padding:6px 12px;text-align:left;border-bottom:1px solid #334155}
.history-table td{padding:8px 12px;font-size:12px;border-bottom:1px solid rgba(51,65,85,.3);color:#f1f5f9}
.history-table tr:last-child td{border-bottom:none}

/* Placeholder views */
.placeholder-view{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;color:#475569;gap:10px}
.placeholder-view svg{width:40px;height:40px;opacity:.3}
.placeholder-view p{font-size:13px}

/* Demo banner */
.demo-banner{background:rgba(59,130,246,.1);border-bottom:1px solid rgba(59,130,246,.2);padding:5px 24px;font-size:11px;color:#93c5fd;display:flex;align-items:center;gap:6px}
</style>
</head>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────

const WEEKS = (() => {
  const weeks = []
  const today = new Date('2026-05-11')
  for (let i = 12; i >= 0; i--) {
    const d = new Date(today)
    d.setDate(d.getDate() - i * 7)
    // normalize to Monday
    const day = d.getDay()
    const diff = day === 0 ? -6 : 1 - day
    d.setDate(d.getDate() + diff)
    weeks.push(d.toISOString().split('T')[0])
  }
  return weeks
})()

const CURRENT_WEEK = WEEKS[WEEKS.length - 1]

function shortDate(iso) {
  const [,m,d] = iso.split('-')
  return `${parseInt(m)}/${parseInt(d)}`
}

function fmt$(n) { return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n) }
function fmtPct(n) { return (n*100).toFixed(1)+'%' }
function fmtNum(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1) }

function fmtVal(v, fmt) {
  if (v === null || v === undefined) return '—'
  if (fmt === 'currency') return fmt$(v)
  if (fmt === 'percent') return fmtPct(v)
  return fmtNum(v)
}

function showView(view) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
  const idx = ['dashboard','scorecard','rocks','issues','todos','vto','acct','meetings'].indexOf(view)
  document.querySelectorAll('.nav-item')[idx]?.classList.add('active')

  const titles = {dashboard:'Dashboard',scorecard:'Scorecard',rocks:'Rocks',issues:'Issues',todos:'To-Dos',vto:'V/TO',acct:'Accountability',meetings:'Meetings'}
  document.getElementById('header-title').textContent = titles[view] || view
  document.getElementById('header-actions').innerHTML = ''

  const c = document.getElementById('main-content')
  if (view === 'dashboard') renderDashboard(c)
  else if (view === 'scorecard') renderScorecard(c)
  else if (view === 'rocks') renderRocks(c)
  else if (view === 'issues') renderIssues(c)
  else if (view === 'todos') renderTodos(c)

// ── Metric Modal ──────────────────────────────────────────────────────────────

function openMetricModal(name) {
  const m = METRICS.find(x => x.name === name)
  if (!m) return

  document.getElementById('modal-title').textContent = m.name
  document.getElementById('modal-sub').textContent = `Goal: ${fmtVal(m.goal, m.fmt)} · 13-week trend · ${m.team}`

  // Chart
  if (activeChart) { activeChart.destroy(); activeChart = null }
  const ctx = document.getElementById('metric-chart').getContext('2d')
  const labels = WEEKS.map(shortDate)
  const actuals = WEEKS.map(w => m.data[w].actual)
  const onTracks = WEEKS.map(w => m.data[w].on_track)
  const isArea = m.fmt === 'percent' || m.name.toLowerCase().includes('ytd') || m.name.toLowerCase().includes('cash')

  if (isArea) {
    activeChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: actuals,
          borderColor: '#22d3ee',
          backgroundColor: 'rgba(34,211,238,.12)',
          pointBackgroundColor: onTracks.map(t => t === null ? '#64748b' : t ? '#22c55e' : '#ef4444'),
          pointBorderColor: '#0f172a',
          pointBorderWidth: 1.5,
          pointRadius: 5,
          fill: true,
          tension: 0.3,
          spanGaps: false
        },{
          data: Array(WEEKS.length).fill(m.goal),
          borderColor: 'rgba(59,130,246,.5)',
          borderDash: [4,4],
          pointRadius: 0,
          fill: false
        }]
      },
      options: chartOpts(m.fmt)
    })
  } else {
    activeChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: actuals,
          backgroundColor: onTracks.map((t,i) => {
            const isCur = WEEKS[i] === CURRENT_WEEK
            const alpha = isCur ? 1 : 0.7
            if (t === null) return `rgba(71,85,105,${alpha})`
            return t ? `rgba(34,197,94,${alpha})` : `rgba(239,68,68,${alpha})`
          }),
          borderRadius: 3,
          maxBarThickness: 32
        },{
          data: Array(WEEKS.length).fill(m.goal),
          type: 'line',
          borderColor: 'rgba(59,130,246,.6)',
          borderDash: [4,4],
          pointRadius: 0,
          fill: false
        }]
      },
      options: chartOpts(m.fmt)
    })
  }

  // History table
  const rows = [...WEEKS].reverse().map(w => {
    const e = m.data[w]
    const dotColor = e.on_track === null ? '#64748b' : e.on_track ? '#4ade80' : '#f87171'
    return `<tr>
      <td style="display:flex;align-items:center;gap:8px">
        <span style="width:7px;height:7px;border-radius:50%;background:${dotColor};display:inline-block;flex-shrink:0"></span>
        ${new Date(w+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
      </td>
      <td style="text-align:right;font-weight:700;color:${e.on_track===null?'#94a3b8':e.on_track?'#4ade80':'#f87171'}">${e.actual !== null ? fmtVal(e.actual, m.fmt) : '—'}</td>
      <td style="text-align:right;color:#64748b">${fmtVal(m.goal, m.fmt)}</td>
    </tr>`
  }).join('')
  document.getElementById('modal-history').innerHTML = `
    <thead><tr>
      <th>Week</th><th style="text-align:right">Actual</th><th style="text-align:right">Goal</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  `

  document.getElementById('metric-modal').classList.add('open')
}

function chartOpts(fmt) {
  const tickFmt = v => {
    if (fmt === 'currency') return v >= 1000 ? `$${(v/1000).toFixed(0)}k` : `$${v}`
    if (fmt === 'percent') return (v*100).toFixed(0)+'%'
    return v
  }
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: {
      backgroundColor: '#0f172a',
      borderColor: '#334155',
      borderWidth: 1,
      titleColor: '#94a3b8',
      bodyColor: '#f1f5f9',
      callbacks: {
        label: ctx => fmtVal(ctx.raw, fmt)
      }
    }},
    scales: {
      x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 10 } } },
      y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 10 }, callback: tickFmt } }
    }
  }
}

function closeModal() {
  document.getElementById('metric-modal').classList.remove('open')
  if (activeChart) { activeChart.destroy(); activeChart = null }
}

document.getElementById('metric-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal()
})

showView('dashboard')
